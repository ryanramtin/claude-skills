name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate every SKILL.md
        run: python3 scripts/validate.py
      - name: every skill is listed in the README
        run: python3 scripts/validate.py --check-readme
